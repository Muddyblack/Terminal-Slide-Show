---
- name: Install the MPV player
  ansible.builtin.copy:
    src: slideshow-player.py
    dest: /usr/local/bin/slideshow-player
    owner: root
    group: root
    mode: "0755"
  notify: Restart the display

- name: Install the display service
  ansible.builtin.template:
    src: slideshow-display.service.j2
    dest: /etc/systemd/system/slideshow-display.service
    owner: root
    group: root
    mode: "0644"
  vars:
    slideshow_display_command: /usr/local/bin/slideshow-player
  notify:
    - Reload systemd
    - Restart the display

- name: Enable the display
  ansible.builtin.systemd_service:
    name: slideshow-display
    enabled: true
    daemon_reload: true
