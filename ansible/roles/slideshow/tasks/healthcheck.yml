---
- name: Wait for the backend to answer
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ slideshow_backend_port }}/api/server-status"
    status_code: 200
  register: slideshow_health
  until: slideshow_health.status == 200
  retries: 12
  delay: 5
  changed_when: false
  check_mode: false
  when: slideshow_backend_mode == 'local'

- name: Check that the display service is running
  ansible.builtin.systemd_service:
    name: slideshow-display
  register: slideshow_display_state
  until: slideshow_display_state.status.ActiveState == 'active'
  retries: 6
  delay: 5
  check_mode: false
  when: slideshow_display_mode != 'none'

# A crash-looping service is briefly "active" between restarts, so one look is not enough.
# Wait a little and check that it is still up and has not restarted in the meantime.
- name: Give the display a moment to prove it stays up
  ansible.builtin.pause:
    seconds: 10
  when: slideshow_display_mode != 'none'

- name: Read the display service again
  ansible.builtin.systemd_service:
    name: slideshow-display
  register: slideshow_display_stable
  check_mode: false
  when: slideshow_display_mode != 'none'

- name: Check that the display service stayed up
  ansible.builtin.assert:
    that:
      - slideshow_display_stable.status.ActiveState == 'active'
      - (slideshow_display_stable.status.NRestarts | default('0') | int)
        <= (slideshow_display_state.status.NRestarts | default('0') | int)
    fail_msg: >-
      The display service keeps restarting. Look at the cause with
      "journalctl -u slideshow-display" on the device.
    quiet: true
  when: slideshow_display_mode != 'none'
