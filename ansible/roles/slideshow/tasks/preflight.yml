---
- name: Check the operating system
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
      - ansible_facts['distribution_major_version'] | int >= 12
      - ansible_facts['architecture'] in ['aarch64', 'armv7l']
    fail_msg: >-
      Raspberry Pi OS Lite (Debian 12 or newer, 32 or 64 bit) is required.
      Found {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
      on {{ ansible_facts['architecture'] }}. The backend needs Node.js 20 or newer,
      which Raspberry Pi OS based on Debian 13 (trixie) provides.
    quiet: true

- name: Check the backend settings
  ansible.builtin.assert:
    that:
      - slideshow_version | length > 0
      - (slideshow_google_service_account | length > 0) or (slideshow_google_api_key | length > 0)
      - slideshow_google_folder_id | length > 0
    fail_msg: >-
      A device that runs the backend needs slideshow_version, slideshow_google_folder_id and
      either slideshow_google_service_account or slideshow_google_api_key.
    quiet: true
  when: slideshow_backend_mode == 'local'

- name: Check the remote backend settings
  ansible.builtin.assert:
    that:
      - slideshow_backend_url is match('^https?://')
      - slideshow_display_mode != 'none'
    fail_msg: slideshow_backend_mode "remote" needs slideshow_backend_url (http:// or https://) and a display.
    quiet: true
  when: slideshow_backend_mode == 'remote'

- name: Check the SSH settings
  ansible.builtin.assert:
    that:
      - slideshow_admin_user | length > 0
      - slideshow_admin_ssh_keys | length > 0
    fail_msg: >-
      Hardening SSH turns off password logins, so it needs slideshow_admin_user and at least one
      public key in slideshow_admin_ssh_keys. Otherwise you would lock yourself out.
      Set slideshow_harden_ssh: false to skip it.
    quiet: true
  when: slideshow_harden_ssh | bool

- name: Check the schedule times
  ansible.builtin.assert:
    that:
      - item is match('^([01][0-9]|2[0-3]):[0-5][0-9]$')
    fail_msg: "{{ item }} is not a time in HH:MM format"
    quiet: true
  loop: "{{ [slideshow_daily_reboot, slideshow_reboot_if_required] | select | list }}"

- name: Check whether the root filesystem is read-only (overlay)
  ansible.builtin.command: findmnt --noheadings --output FSTYPE /
  register: slideshow_root_fstype
  changed_when: false
  check_mode: false

- name: Stop if the device is locked
  ansible.builtin.fail:
    msg: >-
      This device runs with a read-only overlay root, so changes would be lost at the next reboot.
      Use the maintenance playbook, which unlocks it, applies the changes and locks it again.
  when:
    - slideshow_root_fstype.stdout | trim == 'overlay'
    - not (slideshow_allow_locked | default(false) | bool)
