---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart the backend
  ansible.builtin.systemd_service:
    name: slideshow-backend
    state: restarted
    daemon_reload: true
  when: slideshow_backend_mode == 'local'

- name: Restart the display
  ansible.builtin.systemd_service:
    name: slideshow-display
    state: restarted
    daemon_reload: true
  when: slideshow_display_mode != 'none'

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted

- name: Reexecute systemd
  ansible.builtin.systemd_service:
    daemon_reexec: true

- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: restarted
    enabled: true

- name: Reload sshd
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded
