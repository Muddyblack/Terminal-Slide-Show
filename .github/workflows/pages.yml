name: Demo page

# Builds the UI with made-up data (VITE_DEMO_MODE) and publishes it to GitHub Pages.
# There is no backend and no real content in it: see client/src/demo.
on:
  push:
    branches: [master]
    paths:
      - "client/**"
      - "server/data/en/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build:demo
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      # Pages serves 404.html for unknown paths: a reload on /dynamic-view still loads the app
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
