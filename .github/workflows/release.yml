name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test
        run: npm ci && npm test
        working-directory: server
      - name: Package
        run: tools/package-release.sh "${GITHUB_REF_NAME#v}" dist-release
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*.tar.gz
            dist-release/*.sha256
          generate_release_notes: true
